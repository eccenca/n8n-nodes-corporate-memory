# Taskfile for @eccenca/n8n-nodes-corporate-memory
# https://taskfile.dev — wraps the @n8n/node-cli (n8n-node) lifecycle.
---
version: '3'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  deps:
    desc: Install dependencies
    cmds:
      - npm install

  build:
    desc: Compile the node package and copy icons into dist/
    cmds:
      - npm run build

  check-node:
    desc: Verify the active Node.js can run a local n8n
    silent: true
    cmds:
      - |
        # Lower bound: n8n declares engines ">=22.22".
        # Upper bound: n8n native deps (isolated-vm, @confluentinc/kafka-javascript)
        # do not compile against Node 25+ V8 headers, so "npx n8n" exits 1.
        ok="$(node -p 'const [a,b] = process.versions.node.split(".").map(Number); (a >= 22 && a <= 24 && !(a === 22 && b < 22)) ? "yes" : "no"')"
        if [ "$ok" != "yes" ]; then
          echo "Node $(node -v) cannot run a local n8n (need >=22.22 and <25)." >&2
          echo "Fix: run 'nvm use' in this directory (.nvmrc pins 24), then retry." >&2
          exit 1
        fi

  dev:
    desc: Run a local n8n with the node hot-reloaded (http://localhost:5678)
    cmds:
      - task: check-node
      - npm run dev

  lint:
    desc: Lint the credential and node sources
    cmds:
      - npm run lint

  lint-fix:
    desc: Lint and auto-fix (also runs prettier)
    cmds:
      - npm run lint:fix

  test:
    desc: Run the Jest unit tests
    cmds:
      - npm test

  check:
    desc: Run lint, tests and build (the same gates as CI)
    cmds:
      - task: lint
      - task: test
      - task: build

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf dist

  release:
    desc: Build, verify and publish to npm (uses n8n-node release / release-it)
    deps:
      - check
    cmds:
      - npm run release
