---
# GitLab CI for @eccenca/n8n-nodes-corporate-memory — internal build/lint/test
# mirror only. npm publishing happens on GitHub Actions with provenance
# (.github/workflows/publish.yml): n8n verified community nodes must be
# published via GitHub Actions, so there is intentionally no publish job here.
stages:
  - verify

default:
  image: node:22
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/

verify:
  stage: verify
  script:
    - npm ci
    - npm run lint
    - npm test
    - npm run build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
