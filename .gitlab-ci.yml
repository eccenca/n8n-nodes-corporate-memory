# GitLab CI for n8n-nodes-eccenca-corporate-memory.
# The repository lives on gitlab.eccenca.com, so CI runs here rather than on
# GitHub Actions. Publishing with npm provenance requires a trusted-publisher
# setup on a supported CI; adjust the `publish` job to your npm token / OIDC.
stages:
  - verify
  - publish

default:
  image: node:22
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/

verify:
  stage: verify
  script:
    - npm ci
    - npm run lint
    - npm test
    - npm run build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

publish:
  stage: publish
  script:
    - npm ci
    - npm run lint
    - npm test
    - npm run build
    # Requires NPM_TOKEN as a masked, protected CI/CD variable.
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
    - npm publish --provenance --access public
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'
